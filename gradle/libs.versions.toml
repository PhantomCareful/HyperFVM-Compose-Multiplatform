[versions]
agp = "9.2.1"
kotlin = "2.4.21"
miuix = "0.9.5-beta01"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.13.0"
composeBom = "2026.02.01"
# Compose Multiplatform（桌面端）：与 miuix 0.9.5-beta01 的 desktop 变体同一版本线。
composeMultiplatform = "1.12.2"
# Compose 原生大图查看：区域解码（SubSamplingImage）+ 手势缩放（zoomable）。
telephoto = "0.19.0"
# LazyColumn 长按拖动排序（仪表盘卡片排序沿用 Lyrico 插件管理页的做法）。
reorderable = "3.1.0"
# 桌面端的 ICU：Android 用系统内置的 android.icu，桌面只能从 Maven 拉 ICU4J。
icu4j = "77.1"
# 跨端的 LruCache（原先用 android.util.LruCache）。
androidxCollection = "1.5.0"
# org.json 在 Android 上是框架自带，桌面端需要显式引入（包名、API 完全一致）。
orgJson = "20250107"
# 与 Compose 1.12 解析出来的 coroutines-core 保持同一版本线。
coroutines = "1.9.0"
# 桌面端托盘菜单的全局点击探测：JDK 拿不到跨进程的鼠标事件，只能挂 Win32 低层钩子。
jna = "5.14.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# miuix: Compose Multiplatform UI library, coordinates changed at v0.9.0 (miuix -> miuix-ui)
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui", version.ref = "miuix" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons", version.ref = "miuix" }
miuix-preference = { group = "top.yukonga.miuix.kmp", name = "miuix-preference", version.ref = "miuix" }
miuix-blur = { group = "top.yukonga.miuix.kmp", name = "miuix-blur", version.ref = "miuix" }
miuix-squircle = { group = "top.yukonga.miuix.kmp", name = "miuix-squircle", version.ref = "miuix" }
miuix-nav = { group = "top.yukonga.miuix.kmp", name = "miuix-nav", version.ref = "miuix" }
# 0.9.5 新增：OS4 柔光玻璃组件（GlassTopAppBar/NavigationBar/Panel 等）与统一材质模块。
# miuix-shader 已被 miuix-material 取代，RuntimeShader / EdgeStroke 等全部从后者导入。
miuix-glass = { group = "top.yukonga.miuix.kmp", name = "miuix-glass", version.ref = "miuix" }
miuix-glass-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-glass-icons", version.ref = "miuix" }
miuix-material = { group = "top.yukonga.miuix.kmp", name = "miuix-material", version.ref = "miuix" }

# Telephoto：SubSamplingImage 是 subsampling-scale-image-view 的 Compose 适配（区域解码），
# zoomable 提供手势缩放。本地文件场景不用 Coil/Glide 集成模块。
telephoto-subsampling = { group = "me.saket.telephoto", name = "sub-sampling-image", version.ref = "telephoto" }
telephoto-zoomable = { group = "me.saket.telephoto", name = "zoomable", version.ref = "telephoto" }

# reorderable：给 LazyColumn 提供 ReorderableItem 与 longPressDraggableHandle。
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }

# 桌面专用：ICU4J 提供与 android.icu 同名的 Transliterator。
icu4j = { group = "com.ibm.icu", name = "icu4j", version.ref = "icu4j" }
# 跨端 LruCache：androidx.collection 自 1.4 起在 commonMain 里提供 LruCache。
androidx-collection = { group = "androidx.collection", name = "collection", version.ref = "androidxCollection" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
# 桌面端的 Dispatchers.Main：Swing 版实现（Android 由框架自带）。
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
# 直接调 user32.dll：托盘菜单的全局鼠标钩子（SetWindowsHookEx）。
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 起 KMP 库走专用插件，androidTarget() 的旧写法已移除。
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
